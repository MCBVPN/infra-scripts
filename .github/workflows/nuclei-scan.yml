name: SolveBeat Nuclei Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
      scan_id:
        description: 'SolveBeat scan identifier for correlating results'
        required: true
      callback_url:
        description: 'Backend URL to POST results to'
        required: true
      severity:
        description: 'Comma-separated severities to include (blank = all)'
        required: false
        default: ''
      tags:
        description: 'Comma-separated template tags to include (blank = automatic-scan default)'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install nuclei
        run: |
          LATEST=$(curl -s https://api.github.com/repos/projectdiscovery/nuclei/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          VER=${LATEST#v}
          curl -sL "https://github.com/projectdiscovery/nuclei/releases/download/${LATEST}/nuclei_${VER}_linux_amd64.zip" -o nuclei.zip
          unzip -o nuclei.zip nuclei
          chmod +x nuclei
          sudo mv nuclei /usr/local/bin/nuclei
          nuclei -version || true

      - name: Update templates
        run: nuclei -update-templates || true

      - name: Run nuclei
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          SEVERITY: ${{ github.event.inputs.severity }}
          TAGS: ${{ github.event.inputs.tags }}
        run: |
          ARGS=(-u "$TARGET_URL" -as -jsonl -etags dos,fuzz -silent -timeout 10 -rate-limit 100 -no-color -o /tmp/results.jsonl)
          if [ -n "$SEVERITY" ]; then ARGS+=(-severity "$SEVERITY"); fi
          if [ -n "$TAGS" ]; then ARGS+=(-tags "$TAGS"); fi
          nuclei "${ARGS[@]}" || true

      - name: Report results
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          SCAN_ID: ${{ github.event.inputs.scan_id }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          # Findings can be large (verbose raw request/response per match) --
          # passing them via a jq command-line argument (--argjson) hits the
          # OS ARG_MAX limit on real scans with many results ("Argument list
          # too long", confirmed live against a real target). Building the
          # payload entirely via files/stdin avoids any command-line size
          # limit regardless of how many findings there are.
          jq -s '.' /tmp/results.jsonl > /tmp/findings_array.json 2>/dev/null || echo '[]' > /tmp/findings_array.json
          jq -n --arg scanId "$SCAN_ID" --slurpfile findings /tmp/findings_array.json '{scanId:$scanId, findings:$findings[0]}' > /tmp/payload.json
          curl -s -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" --data-binary @/tmp/payload.json
