name: SolveBeat Distributed Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to test'
        required: true
      max_vus:
        description: 'Max concurrent VUs per node'
        required: true
        default: '50'
      hold_seconds:
        description: 'Sustained duration in seconds'
        required: true
        default: '60'
      run_id:
        description: 'SolveBeat run identifier for correlating results'
        required: true
      callback_url:
        description: 'Backend URL to POST results to'
        required: true
      metrics_url:
        description: 'Backend URL to POST periodic metrics ticks to (for live Grafana)'
        required: false
      ramp_seconds:
        description: 'Ramp-up duration in seconds (gradual vs sudden-burst comparison)'
        required: false
        default: '10'
      cache_bust:
        description: 'Append a unique query param per request to force cache misses'
        required: false
        default: 'true'

jobs:
  node:
    strategy:
      matrix:
        node_index: [0, 1]
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Detect own public IP
        id: myip
        run: echo "ip=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Write k6 script
        run: |
          cat > loadtest.js << 'K6EOF'
          import http from 'k6/http';
          import { Counter } from 'k6/metrics';
          // k6's built-in http_req_failed lumps a 429/403 from a WAF or CDN
          // rate-limiter in with a genuine connection failure or 500 from
          // the target -- both just count as "failed". That conflation
          // produced a false "target achieved" report against www.uji.es:
          // the site was returning 4xx to the flood (defending itself, not
          // down), but the blanket error rate crossed the threshold anyway.
          const networkErrors = new Counter('network_errors');
          const serverErrors = new Counter('server_errors');
          const clientErrors = new Counter('client_errors');
          export const options = {
            discardResponseBodies: true,
            scenarios: {
              // Sharp ramp (2s to full VUs) instead of the previous 10s
              // gradual one -- confirmed against www.uji.es (behind
              // Varnish, default 10s grace mode) that a slow ramp gives
              // the backend room to absorb load incrementally, and
              // Varnish's own grace period can fully mask a brief origin
              // stumble before it's even visible. A synchronized burst is
              // what the "thundering herd" literature says actually
              // saturates a connection pool hard enough to matter.
              load_test: {
                executor: 'ramping-vus',
                startVUs: 0,
                stages: [
                  { duration: Number(__ENV.RAMP_SECONDS || 10) + 's', target: Number(__ENV.MAX_VUS) },
                  { duration: Number(__ENV.HOLD_SECONDS) + 's', target: Number(__ENV.MAX_VUS) },
                  { duration: '10s', target: 0 },
                ],
              },
            },
          };
          // A repeated GET against the exact same URL from thousands of VUs
          // mostly measures the target's edge cache (Varnish/CDN), not its
          // real origin -- confirmed against www.uji.es, which sits behind
          // Varnish on an AWS ELB and served most of a 10k-VU run straight
          // from cache with only a brief real-origin blip when the cache
          // happened to be cold. A unique query param per request forces a
          // cache miss every time.
          function cacheBustedUrl() {
            var sep = __ENV.TARGET_URL.indexOf('?') === -1 ? '?' : '&';
            return __ENV.TARGET_URL + sep + '_sbcb=' + Date.now() + '-' + __VU + '-' + __ITER;
          }
          export default function () {
            const url = __ENV.CACHE_BUST === 'false' ? __ENV.TARGET_URL : cacheBustedUrl();
            const res = http.get(url);
            if (res.status === 0) networkErrors.add(1);
            else if (res.status >= 500) serverErrors.add(1);
            else if (res.status >= 400) clientErrors.add(1);
          }
          export function handleSummary(data) {
            const total = data.metrics.http_reqs ? data.metrics.http_reqs.values.count : 0;
            const netErr = data.metrics.network_errors ? data.metrics.network_errors.values.count : 0;
            const srvErr = data.metrics.server_errors ? data.metrics.server_errors.values.count : 0;
            const cliErr = data.metrics.client_errors ? data.metrics.client_errors.values.count : 0;
            const summary = {
              totalRequests: total,
              avgMs: data.metrics.http_req_duration ? data.metrics.http_req_duration.values.avg : null,
              p95Ms: data.metrics.http_req_duration ? data.metrics.http_req_duration.values['p(95)'] : null,
              errorRatePct: data.metrics.http_req_failed ? data.metrics.http_req_failed.values.rate * 100 : 0,
              realFailureRatePct: total > 0 ? ((netErr + srvErr) / total) * 100 : 0,
              rateLimitedPct: total > 0 ? (cliErr / total) * 100 : 0,
            };
            return { '/tmp/summary.json': JSON.stringify(summary), stdout: JSON.stringify(summary) };
          }
          K6EOF

      - name: Run k6
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          MAX_VUS: ${{ github.event.inputs.max_vus }}
          HOLD_SECONDS: ${{ github.event.inputs.hold_seconds }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          NODE_INDEX: ${{ matrix.node_index }}
          METRICS_URL: ${{ github.event.inputs.metrics_url }}
          RAMP_SECONDS: ${{ github.event.inputs.ramp_seconds }}
          CACHE_BUST: ${{ github.event.inputs.cache_bust }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: |
          # k6's own InfluxDB output can't be pointed at our backend safely
          # (it ignores URL-embedded auth and treats the whole path as the
          # bucket name -- confirmed against its actual URL-parsing code).
          # Instead: run k6 in the background with --out json, and every
          # 15s send a cheap rollup (request count / avg latency / current
          # VUs) of just the new lines to our own already-authenticated
          # callback endpoint, which turns it into real InfluxDB points.
          # This is what makes the "Grafana -- live results" panel show
          # something during a Hidden/distributed run, not just Standard.
          k6 run --out json=/tmp/results.ndjson loadtest.js &
          K6_PID=$!

          WINDOW_START=$(date +%s%3N)
          LAST_LINE=0

          send_tick() {
            WINDOW_END=$(date +%s%3N)
            TOTAL_LINES=$(wc -l < /tmp/results.ndjson 2>/dev/null || echo 0)
            if [ -n "$METRICS_URL" ] && [ "$TOTAL_LINES" -gt "$LAST_LINE" ]; then
              tail -n +$((LAST_LINE + 1)) /tmp/results.ndjson > /tmp/delta.ndjson
              LAST_LINE=$TOTAL_LINES
              COUNT=$(grep -c '"metric":"http_req_duration"' /tmp/delta.ndjson || echo 0)
              AVG=$(grep '"metric":"http_req_duration"' /tmp/delta.ndjson | grep -oP '"value":\K[0-9.]+' | awk '{s+=$1; n++} END {if(n>0) printf "%.2f", s/n; else print 0}')
              VUS=$(grep '"metric":"vus"' /tmp/delta.ndjson | tail -1 | grep -oP '"value":\K[0-9.]+' || echo 0)
              if [ "$COUNT" -gt 0 ]; then
                PAYLOAD=$(jq -n --arg runId "$RUN_ID" --argjson nodeIndex "$NODE_INDEX" --argjson windowStartMs "$WINDOW_START" --argjson windowEndMs "$WINDOW_END" --argjson count "$COUNT" --argjson avgMs "${AVG:-0}" --argjson vus "${VUS:-0}" '{runId:$runId, nodeIndex:$nodeIndex, windowStartMs:$windowStartMs, windowEndMs:$windowEndMs, count:$count, avgMs:$avgMs, vus:$vus}')
                curl -s -X POST "$METRICS_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "$PAYLOAD" || true
              fi
            fi
            WINDOW_START=$WINDOW_END
          }

          while kill -0 $K6_PID 2>/dev/null; do
            sleep 15
            send_tick
          done
          wait $K6_PID || true
          # Final flush -- without this the last partial window (up to 15s
          # of real traffic) between the last periodic tick and k6 actually
          # exiting never gets reported, undercounting the live graph's
          # final numbers versus the real summary.
          send_tick

      - name: Report results
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          NODE_INDEX: ${{ matrix.node_index }}
          REPORTED_IP: ${{ steps.myip.outputs.ip }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          SUMMARY=$(cat /tmp/summary.json 2>/dev/null || echo '{}')
          PAYLOAD=$(jq -n --arg runId "$RUN_ID" --argjson nodeIndex "$NODE_INDEX" --arg ip "$REPORTED_IP" --argjson summary "$SUMMARY" '{runId:$runId, nodeIndex:$nodeIndex, reportedIp:$ip, summary:$summary}')
          curl -s -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" -d "$PAYLOAD"







