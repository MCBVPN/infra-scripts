name: SolveBeat Secret Leak Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL to scan'
        required: true
      scan_id:
        description: 'SolveBeat supply_chain_scans.id for correlating results'
        required: true
      callback_url:
        description: 'Backend URL to POST results to'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install puppeteer@23
          curl -sSL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin
          trufflehog --version || true

      - name: Run scan
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
        run: node scripts/run-secret-scan.js

      - name: Report results
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          SCAN_ID: ${{ github.event.inputs.scan_id }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          if [ -f /tmp/secret-scan-error.txt ]; then
            jq -n --arg scanId "$SCAN_ID" --rawfile err /tmp/secret-scan-error.txt '{scanId:$scanId, error:$err}' > /tmp/payload.json
          elif [ -f /tmp/secret-scan-result.json ]; then
            jq -n --arg scanId "$SCAN_ID" --slurpfile result /tmp/secret-scan-result.json '{scanId:$scanId, result:$result[0]}' > /tmp/payload.json
          else
            jq -n --arg scanId "$SCAN_ID" '{scanId:$scanId, error:"Secret scan produced no output"}' > /tmp/payload.json
          fi
          curl -s -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" --data-binary @/tmp/payload.json
