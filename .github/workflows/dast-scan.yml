name: SolveBeat Authenticated DAST Scan

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target base URL (with protocol)'
        required: true
      scan_id:
        description: 'SolveBeat supply_chain_scans.id for correlating results'
        required: true
      callback_url:
        description: 'Backend URL to POST results to'
        required: true
      auth_header:
        description: 'Optional "Header-Name: value" captured while authenticated (e.g. Authorization: Bearer ey...), injected into every request ZAP sends'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run OWASP ZAP full active scan
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          AUTH_HEADER: ${{ github.event.inputs.auth_header }}
        run: |
          mkdir -p /tmp/zap-wrk
          chmod 777 /tmp/zap-wrk

          ZAP_EXTRA=()
          if [ -n "$AUTH_HEADER" ]; then
            HEADER_NAME="${AUTH_HEADER%%:*}"
            HEADER_VALUE="${AUTH_HEADER#*: }"
            ZAP_EXTRA=(-z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=$HEADER_NAME -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement=$HEADER_VALUE")
          fi

          # -m 5: cap the traditional spider phase to 5 minutes.
          # -j: also run the Ajax Spider (headless-browser crawl) after the
          # traditional one -- a plain link-following spider finds almost
          # nothing on a JS-rendered SPA, which otherwise starves the active
          # scan of anything to attack. Job timeout raised to 25m to give
          # the extra crawl phase room.
          # -I: don't fail the container's own exit code on findings (we
          # read the JSON report ourselves; ZAP's exit code is not our
          # success/failure signal here).
          docker run --rm -v /tmp/zap-wrk:/zap/wrk/:rw -t ghcr.io/zaproxy/zaproxy:stable \
            zap-full-scan.py -t "$TARGET_URL" -m 5 -j -J report.json -I "${ZAP_EXTRA[@]}" || true

          ls -la /tmp/zap-wrk || true

      - name: Build findings
        run: node scripts/run-dast-scan.js

      - name: Report results
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          SCAN_ID: ${{ github.event.inputs.scan_id }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          if [ -f /tmp/dast-scan-result.json ]; then
            jq -n --arg scanId "$SCAN_ID" --slurpfile result /tmp/dast-scan-result.json '{scanId:$scanId, result:$result[0]}' > /tmp/payload.json
          else
            jq -n --arg scanId "$SCAN_ID" '{scanId:$scanId, error:"DAST scan produced no output -- target may be unreachable or blocked the scan"}' > /tmp/payload.json
          fi
          curl -s -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" --data-binary @/tmp/payload.json
