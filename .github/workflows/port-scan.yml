name: SolveBeat Port & Service Scan

on:
  workflow_dispatch:
    inputs:
      target_host:
        description: 'Target hostname (no protocol)'
        required: true
      scan_id:
        description: 'SolveBeat supply_chain_scans.id for correlating results'
        required: true
      callback_url:
        description: 'Backend URL to POST results to'
        required: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install naabu and httpx
        run: |
          NAABU_LATEST=$(curl -s https://api.github.com/repos/projectdiscovery/naabu/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          NAABU_VER=${NAABU_LATEST#v}
          curl -sL "https://github.com/projectdiscovery/naabu/releases/download/${NAABU_LATEST}/naabu_${NAABU_VER}_linux_amd64.zip" -o naabu.zip
          unzip -o naabu.zip naabu
          chmod +x naabu
          sudo mv naabu /usr/local/bin/naabu

          HTTPX_LATEST=$(curl -s https://api.github.com/repos/projectdiscovery/httpx/releases/latest | grep -oP '"tag_name": "\K(.*)(?=")')
          HTTPX_VER=${HTTPX_LATEST#v}
          curl -sL "https://github.com/projectdiscovery/httpx/releases/download/${HTTPX_LATEST}/httpx_${HTTPX_VER}_linux_amd64.zip" -o httpx.zip
          unzip -o httpx.zip httpx
          chmod +x httpx
          sudo mv httpx /usr/local/bin/httpx

          naabu -version || true
          httpx -version || true

      - name: Run naabu (connect-scan, top 100 ports -- no raw sockets needed, no elevated privileges)
        env:
          TARGET_HOST: ${{ github.event.inputs.target_host }}
        run: |
          naabu -host "$TARGET_HOST" -top-ports 1000 -scan-type c -rate 1000 -timeout 2000 -silent -json -o /tmp/naabu-results.jsonl || true
          cat /tmp/naabu-results.jsonl 2>/dev/null || echo "(no open ports found)"

      - name: Run httpx against any open ports found
        env:
          TARGET_HOST: ${{ github.event.inputs.target_host }}
        run: |
          if [ -s /tmp/naabu-results.jsonl ]; then
            jq -r --arg host "$TARGET_HOST" '"\($host):\(.port)"' /tmp/naabu-results.jsonl > /tmp/targets.txt
            httpx -l /tmp/targets.txt -silent -json -title -status-code -tech-detect -web-server -timeout 8 -o /tmp/httpx-results.jsonl || true
          fi

      - name: Build findings
        run: node scripts/run-port-scan.js

      - name: Report results
        if: always()
        env:
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
          SCAN_ID: ${{ github.event.inputs.scan_id }}
          CALLBACK_URL: ${{ github.event.inputs.callback_url }}
        run: |
          if [ -f /tmp/port-scan-result.json ]; then
            jq -n --arg scanId "$SCAN_ID" --slurpfile result /tmp/port-scan-result.json '{scanId:$scanId, result:$result[0]}' > /tmp/payload.json
          else
            jq -n --arg scanId "$SCAN_ID" '{scanId:$scanId, error:"Port scan produced no output"}' > /tmp/payload.json
          fi
          curl -s -X POST "$CALLBACK_URL" -H "Content-Type: application/json" -H "X-Callback-Secret: $CALLBACK_SECRET" --data-binary @/tmp/payload.json
