title: Script File Created In Web Upload Directory
id: 6f0c7b1e-3f0a-4c58-9a4e-5d2a1c9b7e02
status: experimental
description: A server-side script file appeared in a directory meant for user uploads. Matches lab rule WEB-02.
author: SolveBeat emulation lab
date: 2026-11-12
tags:
    - attack.persistence
    - attack.t1505.003
logsource:
    category: file_event
    product: linux
detection:
    selection_path:
        TargetFilename|contains:
            - '/uploads/'
            - '/upload/'
            - '/media/'
    selection_ext:
        TargetFilename|endswith:
            - '.php'
            - '.phtml'
            - '.jsp'
            - '.jspx'
            - '.aspx'
            - '.cgi'
            - '.sh'
    condition: selection_path and selection_ext
falsepositives:
    - Deployments that write code into a path containing one of these directory names.
level: high
